<title>Galerie — Tomáš Kyjovský</title>
<meta name="description" content="Fotogalerie — Tomáš Kyjovský.">
<meta name="author" content="Tomáš Kyjovský">
<link rel="canonical" href="https://www.tomaskyjovsky.cz/galerie.html">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tomáš Kyjovský">
<meta property="og:title" content="Galerie — Tomáš Kyjovský">
<meta property="og:description" content="Fotogalerie — pár zachycených okamžiků.">
<meta property="og:url" content="https://www.tomaskyjovsky.cz/galerie.html">
<meta property="og:image" content="https://www.tomaskyjovsky.cz/og.png">
<meta property="og:locale" content="cs_CZ">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        #FBF6EE;
    --bg-soft:   #F4EADB;
    --card:      #FFFDF9;
    --ink:       #3A322B;
    --ink-soft:  #6F6154;
    --line:      #E7D9C6;
    --accent:    #C1673C;
    --accent-2:  #D99A5B;
    --accent-soft:#F6E7D6;
    --shadow:    0 18px 40px -24px rgba(80,52,30,.45);
    --radius:    20px;
  }
  html[data-theme="dark"]{
    --bg:        #201B16;
    --bg-soft:   #2A231C;
    --card:      #2C2620;
    --ink:       #F1E7DA;
    --ink-soft:  #B4A392;
    --line:      #3F362C;
    --accent:    #E08A55;
    --accent-2:  #D99A5B;
    --accent-soft:#3A2C20;
    --shadow:    0 18px 40px -24px rgba(0,0,0,.6);
  }
  html[data-theme="dark"] nav{background:rgba(32,27,22,.82)}
  html[data-theme="dark"] .blob.b1{background:#7A4A28;opacity:.30}
  html[data-theme="dark"] .blob.b2{background:#5A4030;opacity:.26}
  html[data-theme="dark"] .about-card{color:#E4D8C8}
  html[data-theme="dark"] .tl-desc{color:#CBBCA9}
  html[data-theme="dark"] .skill-tags span{color:#E4D8C8}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Work Sans',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    transition:background .3s ease,color .3s ease;
  }
  h1,h2,h3,.serif{font-family:'Lora',Georgia,serif}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:960px;margin:0 auto;padding:0 24px}
  .accent{color:var(--accent)}

  /* soft warm blobs in background */
  .blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;z-index:-1;pointer-events:none}
  .blob.b1{width:460px;height:460px;background:#F3C99A;top:-140px;right:-120px}
  .blob.b2{width:400px;height:400px;background:#EBC7B0;bottom:-160px;left:-140px;opacity:.4}

  /* ---------- NAV ---------- */
  nav{
    position:sticky;top:0;z-index:50;
    backdrop-filter:blur(10px);
    background:rgba(251,246,238,.8);
    border-bottom:1px solid var(--line);
  }
  nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:28px;height:64px}
  .brand{font-family:'Lora';font-weight:600;font-size:1.15rem;letter-spacing:.2px}
  .brand{flex-shrink:0}
  .navright{display:flex;align-items:center;gap:22px;flex-shrink:0}
  .navlinks{display:flex;gap:26px;flex-shrink:0}
  .navlinks a{font-size:.92rem;color:var(--ink-soft);font-weight:500;transition:color .2s;position:relative;white-space:nowrap}
  .navlinks a:hover{color:var(--accent)}
  .navlinks a::after{content:"";position:absolute;left:0;bottom:-6px;height:2px;width:0;background:var(--accent);transition:width .25s}
  .navlinks a:hover::after{width:100%}
  .langswitch{display:flex;gap:3px;align-items:center}
  .langswitch button{
    display:inline-flex;align-items:center;gap:6px;
    border:none;background:transparent;cursor:pointer;
    font-family:'Work Sans',sans-serif;font-size:.76rem;font-weight:600;color:var(--ink-soft);
    padding:5px 9px;border-radius:999px;transition:.2s;letter-spacing:.03em;
  }
  .langswitch button svg{width:20px;height:14px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.1);display:block;flex:0 0 auto}
  .langswitch button:hover{color:var(--accent);background:var(--accent-soft)}
  .langswitch button.active{background:var(--accent);color:#fff}
  .themetoggle{
    border:none;background:transparent;cursor:pointer;color:var(--ink-soft);
    padding:6px;border-radius:999px;display:inline-flex;line-height:0;transition:.2s;
  }
  .themetoggle:hover{color:var(--accent);background:var(--accent-soft)}
  .themetoggle svg{width:20px;height:20px}
  .themetoggle .ic-sun{display:none}
  html[data-theme="dark"] .themetoggle .ic-moon{display:none}
  html[data-theme="dark"] .themetoggle .ic-sun{display:inline-block}
  /* užší obrazovky: přepínač jazyků jen na vlaječky (bez CZ/EN/DE/FR zkratek) */
  @media(max-width:1080px){.langswitch .ll{display:none}.langswitch button{gap:0;padding:5px 7px}}
  /* tablet a méně: skryjeme textové odkazy v liště */
  @media(max-width:900px){.navlinks{display:none}}
  @media(max-width:420px){.langswitch button{padding:4px 5px}.brand{font-size:1.05rem}}

  /* ---------- HERO ---------- */
  header{padding:72px 0 40px}
  .hero{display:flex;gap:44px;align-items:center}
  @media(max-width:720px){.hero{flex-direction:column;text-align:center;gap:28px}}
  .avatar{
    flex:0 0 auto;width:168px;height:168px;border-radius:50%;
    overflow:hidden;box-shadow:var(--shadow);border:6px solid var(--card);
    background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
  .hero-text .eyebrow{
    display:inline-block;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:12px;
    background:var(--accent-soft);padding:5px 14px;border-radius:999px;
  }
  .hero-text h1{font-size:clamp(2.4rem,6vw,3.6rem);line-height:1.05;font-weight:600;letter-spacing:-.5px}
  .hero-text .role{font-size:1.25rem;color:var(--ink-soft);margin-top:10px;font-weight:500}
  .hero-text .loc{margin-top:6px;color:var(--ink-soft);font-size:.98rem}
  .localtime{margin-top:10px;display:inline-flex;align-items:center;gap:8px;font-size:.92rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .localtime #clock{font-weight:600;color:var(--ink)}
  .clock-dot{width:8px;height:8px;border-radius:50%;background:#3fae6a;flex:0 0 auto;animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,174,106,.5)}70%{box-shadow:0 0 0 7px rgba(63,174,106,0)}100%{box-shadow:0 0 0 0 rgba(63,174,106,0)}}
  .hero-cta{margin-top:22px;display:flex;gap:14px;flex-wrap:wrap}
  @media(max-width:720px){.hero-cta{justify-content:center}}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 22px;border-radius:999px;font-weight:600;font-size:.95rem;
    transition:transform .18s,box-shadow .18s,background .2s;
  }
  .btn.primary{background:var(--accent);color:#fff;box-shadow:0 10px 24px -12px rgba(193,103,60,.9)}
  .btn.primary:hover{transform:translateY(-2px);box-shadow:0 14px 28px -12px rgba(193,103,60,.95)}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}

  /* ---------- SECTIONS ---------- */
  section{padding:52px 0}
  .sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:34px}
  .sec-head h2{font-size:1.9rem;font-weight:600;letter-spacing:-.3px;white-space:nowrap}
  .sec-head .line{flex:1;height:1px;background:var(--line)}
  .sec-num{font-family:'Lora';color:var(--accent-2);font-size:1rem;font-style:italic}

  .about-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:34px 36px;box-shadow:var(--shadow);font-size:1.08rem;color:#4a4038;
  }
  .about-card p+p{margin-top:16px}
  .about-highlights{display:flex;flex-wrap:wrap;gap:14px;margin-top:26px}
  .chip{
    background:var(--accent-soft);color:var(--accent);border-radius:12px;
    padding:12px 16px;font-weight:600;font-size:.9rem;display:flex;flex-direction:column;line-height:1.3;
  }
  .chip b{font-family:'Lora';font-size:1.35rem}
  .chip span{color:var(--ink-soft);font-weight:500;font-size:.78rem;letter-spacing:.02em}

  /* ---------- TIMELINE ---------- */
  .timeline{position:relative;padding-left:34px}
  .timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .tl-item{position:relative;padding-bottom:34px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{
    content:"";position:absolute;left:-33px;top:5px;width:16px;height:16px;border-radius:50%;
    background:var(--card);border:3px solid var(--accent);box-shadow:0 0 0 4px var(--bg);
  }
  .tl-item.sub::before{border-color:var(--accent-2);width:12px;height:12px;left:-31px;top:7px}
  .tl-date{font-size:.82rem;color:var(--accent);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
  .tl-role{font-family:'Lora';font-size:1.2rem;font-weight:600;margin-top:2px}
  .tl-company{color:var(--ink-soft);font-weight:500;font-size:.98rem}
  .tl-desc{margin-top:8px;color:#54493f;font-size:.96rem}
  .tl-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .tl-tags span{background:var(--bg-soft);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.78rem;color:var(--ink-soft)}

  /* ---------- GRID cards (edu / skills) ---------- */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 28px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 24px 46px -24px rgba(80,52,30,.5)}
  .edu-item{padding:14px 0;border-bottom:1px dashed var(--line)}
  .edu-item:last-child{border-bottom:none;padding-bottom:0}
  .edu-item:first-child{padding-top:0}
  .edu-school{font-family:'Lora';font-weight:600;font-size:1.05rem}
  .edu-detail{color:var(--ink-soft);font-size:.92rem;margin-top:2px}
  .edu-year{color:var(--accent);font-weight:600;font-size:.82rem;margin-top:4px}

  .skill-group{margin-bottom:22px}
  .skill-group:last-child{margin-bottom:0}
  .skill-group h4{font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:12px;font-weight:600;font-family:'Work Sans'}
  .skill-tags{display:flex;flex-wrap:wrap;gap:9px}
  .skill-tags span{
    background:var(--card);border:1.5px solid var(--line);border-radius:999px;
    padding:6px 15px;font-size:.86rem;font-weight:500;transition:.2s;color:#4a4038;
  }
  .skill-tags span:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .skill-tags span.top{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* ---------- CONTACT ---------- */
  .contact-card{
    background:linear-gradient(135deg,#3A322B 0%,#54463a 100%);
    color:#F6ECDD;border-radius:26px;padding:48px 44px;text-align:center;box-shadow:var(--shadow);
  }
  .contact-card h2{color:#fff;font-size:2rem;margin-bottom:10px}
  .contact-card p{color:#E7D4BF;max-width:520px;margin:0 auto 26px;font-size:1.05rem}
  .cta-stack{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:30px}
  .social-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .book-btn{
    display:inline-flex;align-items:center;gap:10px;
    background:var(--accent);color:#fff;font-weight:600;font-size:1.02rem;
    padding:14px 30px;border-radius:999px;
    box-shadow:0 14px 28px -12px rgba(193,103,60,.85);transition:transform .18s,box-shadow .18s;
  }
  .book-btn:hover{transform:translateY(-2px);box-shadow:0 18px 32px -12px rgba(193,103,60,.95)}
  .book-btn svg{width:20px;height:20px;flex:0 0 auto}
  .soc{
    display:inline-flex;align-items:center;justify-content:center;
    width:46px;height:46px;border-radius:50%;color:#F1E7DA;
    border:1.5px solid rgba(255,255,255,.28);
    transition:transform .18s,border-color .2s,background .2s;
  }
  .soc:hover{border-color:#fff;background:rgba(255,255,255,.10);transform:translateY(-2px)}
  .soc svg{width:20px;height:20px;flex:0 0 auto}
  .contact-links{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
  .contact-links a{
    display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);padding:12px 20px;border-radius:14px;
    font-weight:500;font-size:.95rem;transition:.2s;
  }
  .contact-links a:hover{background:var(--accent);border-color:var(--accent);transform:translateY(-2px)}
  .contact-links svg{width:18px;height:18px;flex:0 0 auto}

  footer{text-align:center;padding:36px 0;color:var(--ink-soft);font-size:.88rem}
  footer .heart{color:var(--accent)}
  footer .localtime{margin:0 0 12px}

  /* reveal on scroll */
  .reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}
  .reveal.in{opacity:1;transform:none}
</style>
<style>
  /* ---------- GALLERY (subpage) ---------- */
  .gal-hero{padding:56px 0 6px;text-align:center}
  .gal-hero .eyebrow{display:inline-block;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:14px;background:var(--accent-soft);padding:6px 16px;border-radius:999px}

    {t:"https://websitegallery.blob.core.windows.net/gallery/thumb/aa16f4ea82ea.jpg",f:"https://websitegallery.blob.core.windows.net/gallery/large/aa16f4ea82ea.jpg",w:2000,h:1335},
    {t:"https://websitegallery.blob.core.windows.net/gallery/thumb/b2d750d60e66.jpg",f:"https://websitegallery.blob.core.windows.net/gallery/large/b2d750d60e66.jpg",w:2000,h:1335}
  ];

  (function(){
    var grid = document.getElementById('galGrid');
    if(!grid) return;
    var ZOOM = '<span class="zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></svg></span>';
    PHOTOS.forEach(function(p, idx){
      var fig = document.createElement('figure');
      fig.className = 'tile'; fig.tabIndex = 0; fig.setAttribute('role','button');
      fig.setAttribute('aria-label', p.alt || ('Fotka ' + (idx+1)));
      var img = document.createElement('img');
      img.src = p.t; img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
      if(p.w) img.width = p.w; if(p.h) img.height = p.h;
      fig.appendChild(img);
      fig.insertAdjacentHTML('beforeend', ZOOM);
      fig.addEventListener('click', function(){ openLb(idx); });
      fig.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openLb(idx); } });
      grid.appendChild(fig);
    });
  })();

  var cur = 0;
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var lbCap = document.getElementById('lbCap');
  var lbCount = document.getElementById('lbCount');
  function showLb(i){
    cur = (i + PHOTOS.length) % PHOTOS.length;
    var p = PHOTOS[cur];
    lbImg.src = p.f; lbImg.alt = '';
    lbCap.textContent = '';
    lbCount.textContent = (cur+1) + ' / ' + PHOTOS.length;
  }
  function openLb(i){ showLb(i); lb.classList.add('open'); document.body.style.overflow = 'hidden'; try { lb.focus(); } catch(e){} }
  function closeLb(){ lb.classList.remove('open'); document.body.style.overflow = ''; lbImg.src = ''; }
  (function(){
    if(!lb) return;
    document.getElementById('lbClose').addEventListener('click', closeLb);
    document.getElementById('lbPrev').addEventListener('click', function(e){ e.stopPropagation(); showLb(cur-1); });
    document.getElementById('lbNext').addEventListener('click', function(e){ e.stopPropagation(); showLb(cur+1); });
    lb.addEventListener('click', function(e){ if(e.target === lb) closeLb(); });
    document.addEventListener('keydown', function(e){
      if(!lb.classList.contains('open')) return;
      if(e.key === 'Escape') closeLb();
      else if(e.key === 'ArrowLeft') showLb(cur-1);
      else if(e.key === 'ArrowRight') showLb(cur+1);
    });
  })();

  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, {threshold:.12});
  document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });
</script>
</body>
</html>
